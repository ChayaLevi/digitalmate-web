<!doctype html>
<!-- Simulated 接龙 (sign-up chain) group chat, for Homemind extraction tests (T0.4).
     Fictional group and names. Rendered to jielong-sample.png by scripts/render-jielong-sample.mjs.
     No printed dates (T9.1): "本周四" and "周五" are read against the demo clock's today, so the
     screenshot stays upcoming whatever day the demo runs. The fake model's quotes (llmFake.ts) match. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 390px; background: #ededed; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 15px; color: #111; }
  .bar { background: #f7f7f7; border-bottom: 1px solid #d9d9d9; padding: 10px 14px 8px; text-align: center; }
  .bar .name { font-weight: 600; font-size: 16px; }
  .bar .sample { margin-top: 2px; font-size: 11px; color: #b25b00; }
  .chat { padding: 10px 10px 16px; }
  .time { text-align: center; color: #999; font-size: 12px; margin: 10px 0 8px; }
  .msg { display: flex; gap: 8px; margin: 10px 0; align-items: flex-start; }
  .msg.me { flex-direction: row-reverse; }
  .avatar { width: 38px; height: 38px; border-radius: 5px; flex: none; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .who { font-size: 12px; color: #888; margin: 0 0 3px 2px; }
  .me .who { text-align: right; margin-right: 2px; }
  .bubble { background: #fff; border-radius: 6px; padding: 8px 10px; line-height: 1.5; max-width: 270px; white-space: pre-wrap; }
  .me .bubble { background: #a9e88b; }
</style>
</head>
<body>
  <div class="bar">
    <div class="name">向日葵班家长群 (32)</div>
    <div class="sample">模拟示例 · Simulated sample</div>
  </div>
  <div class="chat">
    <div class="time">上午 9:12</div>
    <div class="msg">
      <div class="avatar" style="background:#e07a5f">王</div>
      <div><div class="who">王老师</div>
        <div class="bubble">各位家长好！本周四下午3点在班里举办秋季水果派对🍎 请家长们接龙认领要带的水果，切好装盒，够8个小朋友吃。周三晚上8点前接龙完毕，谢谢配合！</div></div>
    </div>
    <div class="msg">
      <div class="avatar" style="background:#81b29a">乐</div>
      <div><div class="who">乐乐妈妈</div>
        <div class="bubble">#接龙
周四水果派对 认领水果

1. 乐乐妈妈 苹果
2. 小雨爸爸 香蕉
3. 朵朵妈妈 葡萄</div></div>
    </div>
    <div class="msg">
      <div class="avatar" style="background:#3d405b">雨</div>
      <div><div class="who">小雨爸爸</div>
        <div class="bubble">请问需要带叉子吗？</div></div>
    </div>
    <div class="time">上午 9:40</div>
    <div class="msg">
      <div class="avatar" style="background:#e07a5f">王</div>
      <div><div class="who">王老师</div>
        <div class="bubble">不用带，班里有准备。另外提醒：周五上午9点全园体检，请给孩子穿方便穿脱的衣服。</div></div>
    </div>
  </div>
</body>
</html>
